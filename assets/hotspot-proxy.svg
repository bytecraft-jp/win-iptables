<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="'Segoe UI','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif" fill="#1f2328">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1099" height="469" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- スマホ -->
  <rect x="55" y="70" width="85" height="170" rx="14" fill="#24292f"/>
  <rect x="62" y="86" width="71" height="138" rx="4" fill="#ddf4ff"/>
  <rect x="84" y="76" width="27" height="5" rx="2.5" fill="#57606a"/>
  <g fill="#54aeff">
    <rect x="70" y="96" width="16" height="16" rx="4"/>
    <rect x="90" y="96" width="16" height="16" rx="4"/>
    <rect x="110" y="96" width="16" height="16" rx="4"/>
    <rect x="70" y="118" width="16" height="16" rx="4"/>
    <rect x="90" y="118" width="16" height="16" rx="4"/>
    <rect x="110" y="118" width="16" height="16" rx="4"/>
  </g>
  <g fill="none" stroke="#0969da" stroke-width="3" stroke-linecap="round">
    <path d="M84,186 a20,20 0 0,1 28,0"/>
    <path d="M89,193 a12,12 0 0,1 18,0"/>
  </g>
  <circle cx="98" cy="200" r="3" fill="#0969da"/>
  <text x="97" y="268" text-anchor="middle" font-size="14" font-weight="bold">スマホ</text>
  <text x="97" y="288" text-anchor="middle" font-size="11" fill="#57606a">DNS: 1.1.1.1（手動）</text>
  <text x="97" y="304" text-anchor="middle" font-size="11" fill="#57606a">pxproxy の CA を信頼</text>

  <!-- ノートPC -->
  <rect x="190" y="30" width="720" height="390" rx="16" fill="#24292f"/>
  <rect x="204" y="44" width="692" height="362" rx="6" fill="#f6f8fa"/>
  <path d="M150,420 H950 L930,446 H170 Z" fill="#57606a"/>
  <rect x="500" y="420" width="100" height="6" rx="3" fill="#8c959f"/>
  <text x="222" y="72" font-size="15" font-weight="bold">ノートPC（Windows）</text>

  <!-- スマホ → ホットスポット -->
  <line x1="142" y1="130" x2="223" y2="130" stroke="#0969da" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="165" y="121" text-anchor="middle" font-size="11" fill="#0969da">Wi-Fi</text>

  <!-- ホットスポット -->
  <rect x="225" y="92" width="150" height="76" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="300" y="114" text-anchor="middle" font-size="12" font-weight="bold">モバイル ホットスポット</text>
  <text x="300" y="134" text-anchor="middle" font-size="12">共有 NAT</text>
  <text x="300" y="154" text-anchor="middle" font-size="11" fill="#57606a" font-family="Consolas,'SFMono-Regular',Menlo,monospace">192.168.137.1</text>

  <line x1="375" y1="130" x2="403" y2="130" stroke="#0969da" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- TUN -->
  <rect x="405" y="92" width="140" height="76" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="475" y="122" text-anchor="middle" font-size="13" font-weight="bold">TUN（Wintun）</text>
  <text x="475" y="144" text-anchor="middle" font-size="12" fill="#57606a">"WinIptables"</text>

  <line x1="545" y1="130" x2="573" y2="130" stroke="#0969da" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- win-iptables -->
  <rect x="575" y="92" width="170" height="76" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/>
  <text x="660" y="116" text-anchor="middle" font-size="14" font-weight="bold">win-iptables</text>
  <text x="660" y="135" text-anchor="middle" font-size="12">ルール評価</text>
  <text x="660" y="155" text-anchor="middle" font-size="10.5" fill="#1a7f37" font-family="Consolas,'SFMono-Regular',Menlo,monospace">! --process * → :8080</text>

  <!-- QUIC DROP -->
  <line x1="595" y1="168" x2="595" y2="192" stroke="#cf222e" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M589,195 l12,12 M601,195 l-12,12" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="583" y="206" text-anchor="end" font-size="11" fill="#cf222e">QUIC（UDP 443）は DROP</text>

  <!-- REDIRECT -->
  <line x1="690" y1="168" x2="690" y2="228" stroke="#0969da" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="698" y="196" font-size="11" fill="#0969da" font-family="Consolas,'SFMono-Regular',Menlo,monospace">REDIRECT</text>
  <text x="698" y="210" font-size="11" fill="#0969da" font-family="Consolas,'SFMono-Regular',Menlo,monospace">tcp 80,443</text>

  <!-- その他の通信 -->
  <path d="M745,112 H832 V298" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="752" y="105" font-size="11" fill="#57606a">その他: ROUTE</text>

  <!-- pxproxy -->
  <rect x="405" y="230" width="340" height="162" rx="8" fill="#ffffff" stroke="#a475f9" stroke-width="2"/>
  <path d="M405,238 a8,8 0 0,1 8,-8 H737 a8,8 0 0,1 8,8 V260 H405 Z" fill="#fbefff"/>
  <line x1="405" y1="260" x2="745" y2="260" stroke="#d8b9ff"/>
  <text x="418" y="251" font-size="14" font-weight="bold" fill="#8250df">pxproxy</text>
  <text x="482" y="251" font-size="11" fill="#57606a">127.0.0.1:8080（透過モード）</text>
  <circle cx="719" cy="243" r="6" fill="none" stroke="#8250df" stroke-width="2"/>
  <line x1="723.5" y1="247.5" x2="730" y2="254" stroke="#8250df" stroke-width="2.5" stroke-linecap="round"/>

  <g font-family="Consolas,'SFMono-Regular',Menlo,monospace" font-size="12">
    <rect x="410" y="266" width="330" height="22" fill="#f6f8fa"/>
    <rect x="410" y="314" width="330" height="22" fill="#f6f8fa"/>
    <text x="418" y="282" font-weight="bold">GET</text>
    <text x="462" y="282" fill="#1a7f37">200</text>
    <text x="500" y="282">www.example.com/</text>
    <text x="418" y="306" font-weight="bold">POST</text>
    <text x="462" y="306" fill="#1a7f37">201</text>
    <text x="500" y="306">api.example.com/v1/login</text>
    <text x="418" y="330" font-weight="bold">GET</text>
    <text x="462" y="330" fill="#1a7f37">200</text>
    <text x="500" y="330">cdn.example.net/app.js</text>
    <text x="418" y="354" font-weight="bold">GET</text>
    <text x="462" y="354" fill="#9a6700">304</text>
    <text x="500" y="354">api.example.com/v1/feed</text>
  </g>
  <text x="418" y="381" font-size="11" fill="#57606a">HTTPS は SNI で宛先を判断して復号・表示</text>

  <!-- pxproxy → 物理NIC -->
  <line x1="745" y1="330" x2="783" y2="330" stroke="#0969da" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="764" y="321" text-anchor="middle" font-size="10" fill="#0969da">上流</text>

  <!-- 物理NIC -->
  <rect x="785" y="300" width="95" height="60" rx="8" fill="#eaeef2" stroke="#8c959f"/>
  <text x="832" y="325" text-anchor="middle" font-size="13" font-weight="bold">物理 NIC</text>
  <text x="832" y="344" text-anchor="middle" font-size="11" fill="#57606a">Wi-Fi / 有線</text>
  <text x="832" y="377" text-anchor="middle" font-size="10" fill="#57606a">プロキシ自身の通信は</text>
  <text x="832" y="391" text-anchor="middle" font-size="10" fill="#57606a">ルールの対象外</text>

  <!-- 物理NIC → インターネット -->
  <line x1="880" y1="330" x2="958" y2="330" stroke="#0969da" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M975,352 a18,18 0 0,1 2,-36 a26,26 0 0,1 48,-10 a22,22 0 0,1 38,14 a17,17 0 0,1 0,32 Z" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1020" y="338" text-anchor="middle" font-size="12" font-weight="bold">インターネット</text>

  <!-- 凡例 -->
  <g font-size="11" fill="#57606a">
    <line x1="228" y1="318" x2="262" y2="318" stroke="#0969da" stroke-width="2.5" marker-end="url(#ab)"/>
    <text x="270" y="322">スマホの通信</text>
    <line x1="228" y1="342" x2="262" y2="342" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
    <text x="270" y="346">PC 自身の通信など</text>
    <text x="228" y="372">応答は同じ経路を逆向きに戻る</text>
  </g>
</svg>
